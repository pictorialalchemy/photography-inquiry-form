<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session Inquiry | Pictorial Alchemy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Georgia', serif;
      background-color: #f9f6f1;
      background-attachment: fixed;
      color: #2c2c2c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    body::before {
      content: '';
      position: fixed;
      top: -60px;
      left: -60px;
      width: 520px;
      height: 420px;
      background: radial-gradient(ellipse at 20% 20%,
        rgba(255,255,200,0.82) 0%,
        rgba(255,240,180,0.55) 30%,
        rgba(255,230,150,0.25) 55%,
        transparent 75%);
      pointer-events: none;
      z-index: 0;
      border-radius: 50%;
      filter: blur(22px);
    }
    .card {
      position: relative;
      z-index: 1;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.08);
      padding: 48px 44px;
      max-width: 580px;
      width: 100%;
    }
    .brand { text-align: center; margin-bottom: 32px; }
    .brand h1 { font-size: 1.8rem; font-weight: normal; letter-spacing: 0.02em; color: #1a1a1a; }
    .brand p { margin-top: 6px; font-size: 0.9rem; color: #7a7a7a; font-style: italic; }
    .form-group { margin-bottom: 22px; }
    label { display: block; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: #555; margin-bottom: 8px; font-family: 'Georgia', serif; }
    label .req { color: #b0806a; }
    input, select, textarea { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem; font-family: 'Georgia', serif; color: #2c2c2c; background: #fafafa; transition: border-color 0.2s, box-shadow 0.2s; appearance: none; -webkit-appearance: none; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #b0806a; box-shadow: 0 0 0 3px rgba(176,128,106,0.12); background: #fff; }
    .select-wrap { position: relative; }
    .select-wrap::after { content: '\25BE'; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; color: #888; font-size: 1rem; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    textarea { resize: vertical; min-height: 110px; }
    .btn { width: 100%; padding: 15px; background: #2c2c2c; color: #fff; border: none; border-radius: 6px; font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; font-family: 'Georgia', serif; cursor: pointer; margin-top: 8px; transition: background 0.2s, transform 0.1s; }
    .btn:hover { background: #444; }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { background: #aaa; cursor: not-allowed; }
    .msg { display: none; border-radius: 6px; padding: 14px 16px; margin-top: 16px; font-size: 0.9rem; line-height: 1.5; text-align: center; }
    .msg.success { background: #f0faf4; border: 1px solid #7dba9a; color: #2d6b47; }
    .msg.error { background: #fff5f5; border: 1px solid #e0a0a0; color: #8b2c2c; }
    footer { margin-top: 28px; font-size: 0.75rem; color: #aaa; text-align: center; letter-spacing: 0.06em; position: relative; z-index: 1; }
    @media (max-width: 520px) {
      .card { padding: 32px 22px; }
      .row { grid-template-columns: 1fr; }
      .brand h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <h1>Pictorial Alchemy</h1>
      <p>Session Inquiry &mdash; Let&rsquo;s create something beautiful together.</p>
    </div>
    <form id="inquiryForm">
      <div class="form-group">
        <label for="session">Session Category <span class="req">*</span></label>
        <div class="select-wrap">
          <select id="session" name="session" required>
            <option value="" disabled selected>Select a session type...</option>
            <option value="Portraits">Portraits</option>
            <option value="Couples">Couples</option>
            <option value="Engagement">Engagement</option>
            <option value="Wedding">Wedding</option>
            <option value="Maternity">Maternity</option>
            <option value="Newborn">Newborn</option>
            <option value="Family">Family</option>
            <option value="Children / Milestone">Children / Milestone</option>
            <option value="Quinceanera">Quince&ntilde;era</option>
            <option value="Senior / Graduation">Senior / Graduation</option>
            <option value="Headshots / Brand">Headshots / Brand</option>
            <option value="Boudoir">Boudoir</option>
            <option value="Other">Other / Not Listed</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="desired_date">Desired Session Date <span class="req">*</span></label>
        <input type="date" id="desired_date" name="desired_date" required />
      </div>
      <div class="form-group">
        <label for="name">Full Name <span class="req">*</span></label>
        <input type="text" id="name" name="name" placeholder="Your full name" required />
      </div>
      <div class="form-group row">
        <div>
          <label for="phone">Phone Number <span class="req">*</span></label>
          <input type="tel" id="phone" name="phone" placeholder="(956) 000-0000" required />
        </div>
        <div>
          <label for="email">Email Address <span class="req">*</span></label>
          <input type="email" id="email" name="email" placeholder="you@email.com" required />
        </div>
      </div>
      <div class="form-group">
        <label for="message">Tell Me About Your Vision</label>
        <textarea id="message" name="message" placeholder="Share any details, ideas, locations, or questions you have..."></textarea>
      </div>
      <button type="submit" class="btn" id="submitBtn">Send My Inquiry</button>
      <div class="msg success" id="successMsg">Thank you! Your inquiry has been received. I&rsquo;ll be in touch within 48 hours.</div>
      <div class="msg error" id="errorMsg">Something went wrong. Please try again or email me directly.</div>
    </form>
  </div>
  <footer>&copy; 2026 Pictorial Alchemy &mdash; All rights reserved.</footer>
  <script>
    const phoneInput = document.getElementById('phone');
    phoneInput.addEventListener('input', function () {
      let val = this.value.replace(/\D/g, '').substring(0, 10);
      if (val.length >= 6) { val = '(' + val.substring(0,3) + ') ' + val.substring(3,6) + '-' + val.substring(6); }
      else if (val.length >= 3) { val = '(' + val.substring(0,3) + ') ' + val.substring(3); }
      this.value = val;
    });
    document.getElementById('inquiryForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const successMsg = document.getElementById('successMsg');
      const errorMsg = document.getElementById('errorMsg');
      btn.disabled = true;
      btn.textContent = 'Sending...';
      successMsg.style.display = 'none';
      errorMsg.style.display = 'none';
      const formData = new FormData(this);
      try {
        const res = await fetch('/api/submit', { method: 'POST', body: formData });
        if (res.ok) { successMsg.style.display = 'block'; this.reset(); }
        else { const data = await res.json(); errorMsg.textContent = data.error || 'Something went wrong.'; errorMsg.style.display = 'block'; }
      } catch (err) { errorMsg.style.display = 'block'; }
      btn.disabled = false;
      btn.textContent = 'Send My Inquiry';
    });
  </script>
</body>
</html>
